name: One-shot fix Experience menu icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-experience-icon.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch icon and bump version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("src/main.ts")
          text = path.read_text(encoding="utf-8")
          start = text.index('const EXPERIENCE_GHOST_TRASH_ICON =')
          end_marker = '].join("");'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''const EXPERIENCE_GHOST_TRASH_ICON = "experience-ghost-trash-v3";
          const EXPERIENCE_GHOST_TRASH_SVG = [
            '<g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">',
            '<path d="M18 25h64"/>',
            '<path d="M36 25v-8h28v8"/>',
            '<path d="M76 25l-5 59H29l-5-59"/>',
            '<path d="M37 69V52c0-8 5.8-14 13-14s13 6 13 14v17l-7-4.5-6 4.5-6-4.5-7 4.5Z"/>',
            '</g>',
            '<circle cx="45" cy="52" r="3" fill="currentColor"/>',
            '<circle cx="55" cy="52" r="3" fill="currentColor"/>',
          ].join("");'''.replace("          ", "")
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          manifest = Path("manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["version"] = "0.8.2"
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          package = Path("package.json")
          package_data = json.loads(package.read_text(encoding="utf-8"))
          package_data["version"] = "0.8.2"
          package.write_text(json.dumps(package_data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          lock = Path("package-lock.json")
          lock_data = json.loads(lock.read_text(encoding="utf-8"))
          lock_data["version"] = "0.8.2"
          lock_data["packages"][""]["version"] = "0.8.2"
          lock.write_text(json.dumps(lock_data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          versions = Path("versions.json")
          versions_data = json.loads(versions.read_text(encoding="utf-8"))
          versions_data["0.8.2"] = "1.5.0"
          versions.write_text(json.dumps(versions_data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Commit fix and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/fix-experience-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Experience menu icon scale"
          git push origin HEAD:main
