name: Apply Experience 0.8.3 icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/icon-v083-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch icon, theme color and version
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('src/main.ts')
          s = p.read_text()
          start = s.index('const EXPERIENCE_GHOST_TRASH_ICON =')
          end = s.index('export interface ExperienceGhostArchiveApiResult')
          block = '''const EXPERIENCE_GHOST_TRASH_ICON = "experience-ghost-trash-v4";
          const EXPERIENCE_GHOST_TRASH_SVG = [
            '<rect x="7" y="21" width="86" height="13" rx="4" fill="currentColor"/>',
            '<path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M13 35h74l-7 59H20l-7-59Zm31 25a8 12 0 1 1-16 0 8 12 0 1 1 16 0Zm28 0a8 12 0 1 1-16 0 8 12 0 1 1 16 0Z"/>',
            '<path d="M34 21V8h32v13" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>',
          ].join("");

          '''
          s = s[:start] + block + s[end:]
          old = '''        item
                    .setTitle("Отправить в опыт")
                    .setIcon(EXPERIENCE_GHOST_TRASH_ICON)
                    .setWarning(true)
                    .setSection("danger")
                    .onClick(() => void this.archiveNote(file));'''
          new = '''        item
                    .setTitle("Отправить в опыт")
                    .setIcon(EXPERIENCE_GHOST_TRASH_ICON)
                    .setWarning(true)
                    .setSection("danger")
                    .onClick(() => void this.archiveNote(file));
                  (item as unknown as { dom?: HTMLElement }).dom?.addClass("experience-archive-menu-item");'''
          if old not in s:
              raise SystemExit('menu block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          css = Path('styles.css')
          c = css.read_text().rstrip() + '''

          /* Explicit archive action: use the active theme's semantic negative color. */
          .menu-item.experience-archive-menu-item,
          .menu-item.experience-archive-menu-item .menu-item-title,
          .menu-item.experience-archive-menu-item .menu-item-icon,
          .menu-item.experience-archive-menu-item .menu-item-icon svg {
            color: var(--text-error) !important;
          }

          .menu-item.experience-archive-menu-item {
            --icon-color: var(--text-error);
            --icon-color-hover: var(--text-error);
          }

          .menu-item.experience-archive-menu-item .menu-item-icon svg {
            transform: scale(1.16);
            transform-origin: center;
          }
          '''
          css.write_text(c + '\n')

          for name in ('manifest.json', 'package.json'):
              path = Path(name)
              data = json.loads(path.read_text())
              data['version'] = '0.8.3'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          lock = Path('package-lock.json')
          data = json.loads(lock.read_text())
          data['version'] = '0.8.3'
          data['packages']['']['version'] = '0.8.3'
          lock.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          versions = Path('versions.json')
          data = json.loads(versions.read_text())
          data['0.8.3'] = '1.5.0'
          versions.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace('красный пункт', 'пункт в отрицательном цвете текущей темы')
          r = r.replace('красным цветом', 'отрицательным цветом текущей темы')
          readme.write_text(r)
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit release
        run: |
          rm .github/workflows/icon-v083-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Experience 0.8.3 theme-negative ghost trash icon"
          git push
